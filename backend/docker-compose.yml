version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medical_erp_postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: medical_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: medical_erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - erp-network

  minio:
    image: minio/minio
    container_name: medical_erp_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - erp-network

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  erp-network:
    driver: bridge
